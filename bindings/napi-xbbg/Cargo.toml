[package]
name = "napi-xbbg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "N-API (Node.js) bindings for xbbg Bloomberg engine"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { workspace = true, features = ["async", "tokio_rt", "serde-json", "napi4"] }
napi-derive = { workspace = true }
arrow = { workspace = true, features = ["ipc"] }
chrono = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
xbbg_core = { path = "../../crates/xbbg-core", default-features = false }
xbbg-async = { path = "../../crates/xbbg-async", default-features = false }
xbbg-log = { path = "../../crates/xbbg-log" }
xbbg-ext = { path = "../../crates/xbbg-ext" }
xbbg-recipes = { path = "../../crates/xbbg-recipes", default-features = false }

[features]
default = ["live"]
live = ["xbbg_core/live", "xbbg-async/live", "xbbg-recipes/live"]

[build-dependencies]
napi-build = { workspace = true }
