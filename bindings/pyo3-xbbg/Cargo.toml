[package]
name = "pyo3-xbbg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PyO3 bindings for xbbg Bloomberg engine"

[lib]
name = "_core"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
required-features = ["stub-gen"]

[dependencies]
mimalloc = { workspace = true, optional = true }
pyo3 = { workspace = true }
pyo3-async-runtimes = { workspace = true, features = ["tokio-runtime"] }
pyo3-stub-gen = { workspace = true, features = ["infer_signature"], optional = true }
pyo3-stub-gen-derive = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync"] }
xbbg-log = { path = "../../crates/xbbg-log" }
arrow-array = { workspace = true, features = ["ffi", "chrono-tz"] }
arrow-schema = { workspace = true, features = ["ffi"] }
chrono = { workspace = true, features = ["std"] }
chrono-tz = { workspace = true }
pyo3-arrow = { workspace = true }
xbbg-arrow = { path = "../../crates/xbbg-arrow" }
anyhow = { workspace = true }
serde_json = { workspace = true }
xbbg_core = { path = "../../crates/xbbg-core", default-features = false }
xbbg-async = { path = "../../crates/xbbg-async", default-features = false }
xbbg-ext = { path = "../../crates/xbbg-ext" }
xbbg-recipes = { path = "../../crates/xbbg-recipes", default-features = false }

[features]
default = ["live", "extension-module"]
extension-module = ["pyo3/extension-module"]
mimalloc = ["dep:mimalloc"]
stub-gen = ["dep:pyo3-stub-gen", "dep:pyo3-stub-gen-derive"]
live = ["xbbg_core/live", "xbbg-async/live", "xbbg-recipes/live"]
