[package]
name = "blpapi-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
links = "blpapi"
description = "Unsafe, zero-policy FFI bindings to blpapi C API (blpapi_*) generated at build time."
publish = false

[features]
default = ["dynamic"]
static = []
dynamic = []

[dependencies]
cty = { workspace = true }

[build-dependencies]
bindgen = { workspace = true, features = ["runtime"] }

# `static` and `dynamic` select the blpapi linkage and are mutually exclusive:
# build.rs panics when both are set (see build.rs:32). `--all-features` is
# therefore unsupported for this crate by design, which is why docs.rs is given
# the default linkage explicitly instead of `all-features = true`.
[package.metadata.docs.rs]
features = ["dynamic"]
