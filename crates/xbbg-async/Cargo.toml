[package]
name = "xbbg-async"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Async worker-pool engine over xbbg-core for Bloomberg API requests and subscriptions"
publish = false

[dependencies]
xbbg_core = { path = "../xbbg-core", default-features = false }
xbbg-ext = { path = "../xbbg-ext" }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
xbbg-log = { path = "../xbbg-log" }
once_cell = { workspace = true }
slab = { workspace = true }
arrow-array = { workspace = true, features = ["chrono-tz"] }
arrow-schema = { workspace = true }
arrow-select = { workspace = true }
futures-util = { workspace = true }
indexmap = { workspace = true }
# Spells out chrono's default feature set, which this crate previously picked up
# implicitly; `clock` is the one it actually needs for wall-clock timestamps.
chrono = { workspace = true, features = ["clock", "std", "oldtime", "wasmbind"] }
chrono-tz = { workspace = true }
iana-time-zone = { workspace = true }
parking_lot = { workspace = true }
arc-swap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
itoa = { workspace = true }
ryu = { workspace = true }
smallvec = { workspace = true }

[features]
default = ["live"]
live = ["xbbg_core/live"]
bench-internals = []

# cargo-udeps false positives (xbbg-log re-exports tracing macros)
[package.metadata.cargo-udeps.ignore]
normal = ["xbbg-log"]

[dev-dependencies]
blpapi-sys = { path = "../blpapi-sys" }
tempfile = { workspace = true }
tracing = { workspace = true }
# Restores tracing-subscriber's default set on top of the env-filter this uses.
tracing-subscriber = { workspace = true, features = [
  "smallvec",
  "fmt",
  "ansi",
  "tracing-log",
  "std",
  "env-filter",
] }
