[package]
name = "xbbg-async"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Async worker-pool engine over xbbg-core for Bloomberg API requests and subscriptions"
publish = false

[dependencies]
xbbg_core = { path = "../xbbg-core", default-features = false }
xbbg-ext = { path = "../xbbg-ext" }
thiserror = "2.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "sync", "time"] }
xbbg-log = { path = "../xbbg-log" }
once_cell = "1.19"
slab = "0.4"
arrow-array = { version = "59.0.0", default-features = false, features = ["chrono-tz"] }
arrow-schema = "59.0.0"
arrow-select = "59.0.0"
futures-util = "0.3"
indexmap = "2.7"
chrono = "0.4"
chrono-tz = "0.10"
iana-time-zone = "0.1"
parking_lot = "0.12"
arc-swap = "1.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
itoa = "1.0"
ryu = "1.0"
smallvec = { version = "1.13", features = ["union"] }

[features]
default = ["live"]
live = ["xbbg_core/live"]
bench-internals = []

# cargo-udeps false positives (xbbg-log re-exports tracing macros)
[package.metadata.cargo-udeps.ignore]
normal = ["xbbg-log"]

[dev-dependencies]
blpapi-sys = { path = "../blpapi-sys" }
tempfile = "3.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
