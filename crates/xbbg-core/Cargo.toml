[package]
name = "xbbg_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust core for xbbg Python package (PyO3)"

[lib]
name = "xbbg_core"

[features]
default = ["live"]
live = ["xbbg-sys/live"]

[dependencies]
thiserror = { workspace = true }
xbbg-sys = { path = "../xbbg-sys", default-features = false }
rustc-hash = { workspace = true }  # Fast non-cryptographic hashing for Name cache

# Benchmarks have been consolidated into crates/xbbg-bench.
# Run with: cargo bench --package xbbg-bench
