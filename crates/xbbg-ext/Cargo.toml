[package]
name = "xbbg-ext"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
description = "Extension utilities for xbbg - futures resolution, currency adjustment, historical data helpers"

[dependencies]
# Arrow for zero-copy DataFrame operations (narrow crates keep Python wheels small).
arrow-array = { workspace = true, features = ["chrono-tz"] }
arrow-schema = { workspace = true }

# Date/time handling
chrono = { workspace = true, features = ["std", "serde"] }
chrono-tz = { workspace = true }

# Compile-time perfect hash maps for constants
phf = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Market rules loading
serde = { workspace = true }
toml = { workspace = true }

# Benchmarks have been consolidated into crates/xbbg-bench.
