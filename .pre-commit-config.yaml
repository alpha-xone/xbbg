repos:
  # Basic hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        files: ^(py-xbbg/src/|py-xbbg/tests/|src/|\\.github/|pyproject\\.toml|Cargo\\.toml|README\\.md|\\.pre-commit-config\\.yaml)
      - id: trailing-whitespace
        files: ^(py-xbbg/src/|py-xbbg/tests/|src/|\\.github/|pyproject\\.toml|Cargo\\.toml|README\\.md|\\.pre-commit-config\\.yaml)
      - id: mixed-line-ending
        args: [--fix=lf]
        files: ^(py-xbbg/src/|py-xbbg/tests/|src/|\\.github/|pyproject\\.toml|Cargo\\.toml|README\\.md|\\.pre-commit-config\\.yaml)

  # Local hooks — tools provided by the pixi environment
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check py-xbbg/src py-xbbg/tests
        language: system
        types_or: [python]
        files: ^(py-xbbg/src/|py-xbbg/tests/)
        pass_filenames: false

      - id: ruff-format
        name: ruff-format
        entry: ruff format --check py-xbbg/src py-xbbg/tests
        language: system
        types_or: [python]
        files: ^(py-xbbg/src/|py-xbbg/tests/)
        pass_filenames: false


      - id: js-format-check
        name: js-format-check
        entry: npm --prefix js-xbbg run format:check
        language: system
        files: ^js-xbbg/
        pass_filenames: false

      - id: js-lint
        name: js-lint
        entry: npm --prefix js-xbbg run lint
        language: system
        files: ^js-xbbg/
        pass_filenames: false

      - id: cargo-fmt
        name: cargo-fmt
        entry: cargo fmt --all -- --check
        language: system
        types_or: [rust]
        files: ^(crates/|src|tests|benches|examples)/
        pass_filenames: false

      - id: cargo-clippy
        name: cargo-clippy
        entry: cargo clippy -- -D warnings
        language: system
        types_or: [rust]
        files: ^(crates/|src|tests|benches|examples)/
        pass_filenames: false
